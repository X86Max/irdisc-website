name: "Sign the guestbook"
description: "Leave a message in the IRdisC Guestbook."
title: "[Guestbook] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for stopping by!

        Guestbook messages are public and manually reviewed before appearing on the IRdisC website.

        Please do not include private information or anything you would not want published.

  - type: input
    id: display-name
    attributes:
      label: "Display name"
      placeholder: "Your name or nickname"
    validations:
      required: true

  - type: textarea
    id: message
    attributes:
      label: "Message"
      description: "Leave a message for the IRdisC project."
      placeholder: "Hello from my corner of the Internet!"
    validations:
      required: true

  - type: input
    id: website
    attributes:
      label: "Website (optional)"
      description: "Your personal website or project page, if you want it linked with your entry."
      placeholder: "https://example.com/"
    validations:
      required: false
